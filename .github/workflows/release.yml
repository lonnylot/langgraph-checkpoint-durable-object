name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install an npm CLI that supports trusted publishing
        run: npm install -g npm@11.15.0
      - run: npm ci
      - name: Open a version pull request or publish
        uses: changesets/action@v1
        with:
          publish: node scripts/publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
